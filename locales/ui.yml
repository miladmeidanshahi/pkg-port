    en: "Select Network."
    fa: "گزینهٔ Network (شبکه) را انتخاب کنید."
  ps5_guide_three:
    en: "Select Settings, then Set Up Internet Connection."
    fa: "گزینهٔ Settings و سپس Set Up Internet Connection را انتخاب کنید."
  ps5_guide_four:
    en: "Scroll down and select Set Up Manually."
    fa: "به پایین بروید و Set Up Manually را انتخاب کنید."
  ps5_guide_five:
    en: "Choose Use Wi-Fi or Use a LAN Cable for your connection."
    fa: "با توجه به نوع اتصال خود، Use Wi-Fi یا Use a LAN Cable را انتخاب کنید."
  ps5_guide_six:
    en: "Select Proxy Server, then Use. The screenshot shows a wired connection; Wi-Fi has the same proxy setting."
    fa: "Proxy Server و سپس Use را انتخاب کنید. تصویر مربوط به اتصال کابلی است؛ اتصال Wi-Fi نیز همین گزینهٔ پروکسی را دارد."
  ps5_guide_seven:
    en: "Enter the proxy address and port shown by PKGPort, then select Done."
    fa: "نشانی و درگاه پروکسی نشان‌داده‌شده در PKGPort را وارد کنید و سپس Done را انتخاب کنید."
  ps5_guide_eight:
    en: "Wait while your PS5 checks the connection."
    fa: "صبر کنید تا PS5 اتصال را بررسی کند."
  ps5_guide_nine:
    en: "Check that the network status says Connected."
    fa: "بررسی کنید که وضعیت شبکه Connected باشد."
