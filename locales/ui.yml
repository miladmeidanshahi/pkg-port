    en: "PS4 setup guide"
    fa: "راهنمای تنظیم PS4"
  ps4_guide_one:
    en: "On your PS4, open Settings (the toolbox icon)."
    fa: "در PS4، Settings (نماد جعبه‌ابزار) را باز کنید."
  ps4_guide_two:
    en: "Select Network."
    fa: "Network را انتخاب کنید."
  ps4_guide_three:
    en: "Select Set Up Internet Connection."
    fa: "Set Up Internet Connection را انتخاب کنید."
  ps4_guide_four:
    en: "Choose Use Wi-Fi or Use a LAN Cable for your connection."
    fa: "با توجه به اتصال خود، Use Wi-Fi یا Use a LAN Cable را انتخاب کنید."
  ps4_guide_five:
    en: "Select Custom."
    fa: "Custom را انتخاب کنید."
  ps4_guide_six:
    en: "If using Wi-Fi, select your network and enter its password. With a LAN cable, skip this screen."
    fa: "اگر از Wi-Fi استفاده می‌کنید، شبکهٔ خود را انتخاب کنید و رمز آن را وارد کنید. با کابل LAN از این صفحه بگذرید."
  ps4_guide_seven:
    en: "Select Automatic for IP Address Settings."
    fa: "برای IP Address Settings، گزینهٔ Automatic را انتخاب کنید."
  ps4_guide_eight:
    en: "Select Do Not Specify for DHCP Host Name, then Automatic for DNS Settings."
    fa: "برای DHCP Host Name، گزینهٔ Do Not Specify و سپس برای DNS Settings گزینهٔ Automatic را انتخاب کنید."
  ps4_guide_nine:
    en: "Select Automatic for MTU Settings."
    fa: "برای MTU Settings، گزینهٔ Automatic را انتخاب کنید."
  ps4_guide_ten:
    en: "At Proxy Server, select Use."
    fa: "در بخش Proxy Server، گزینهٔ Use را انتخاب کنید."
  ps4_guide_eleven:
    en: "Enter the PKGPort proxy address and port shown here, then continue."
    fa: "نشانی و درگاه پروکسی PKGPort را که اینجا نشان داده شده وارد کنید و ادامه دهید."
