[package]
name = "pkgport"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
repository = "https://github.com/miladmeidanshahi/pkg-port"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
gpui-kit = "0.9.1"
rust-i18n = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.14"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
url = "2.5"
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4.4"

[dev-dependencies]
gpui-kit = { version = "0.9.1", features = ["test-support"] }
