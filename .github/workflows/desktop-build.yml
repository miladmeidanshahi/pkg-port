name: Desktop builds

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: pkgport-linux-x86_64
            suffix: linux-x86_64.deb
            binary: target/release/pkgport
          - runner: windows-2022
            artifact: pkgport-windows-x86_64-setup
            suffix: windows-x86_64-setup.exe
            binary: target/release/pkgport.exe
          - runner: macos-15
            artifact: pkgport-macos-aarch64
            suffix: macos-aarch64.dmg
            arch: aarch64
            binary: target/release/pkgport
          - runner: macos-15-intel
            artifact: pkgport-macos-x86_64
            suffix: macos-x86_64.dmg
            arch: x86_64
            binary: target/release/pkgport

    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev vulkan-validationlayers libvulkan1
      - name: Use stable Rust
        run: rustup update stable
      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "pkgport"))')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check toolchain
        run: |
          rustc --version
          cargo --version
      - name: Test
        run: cargo test --locked --release
      - name: Build release executable
        run: cargo build --locked --release
      - name: Package executable
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
          BINARY: ${{ matrix.binary }}
          ARCH: ${{ matrix.arch }}
        run: |
          artifact="pkgport-$VERSION-$SUFFIX"
          mkdir -p dist
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            root="$RUNNER_TEMP/pkgport-deb-root"
            install -Dm755 "$BINARY" "$root/usr/bin/pkgport"
            install -Dm644 assets/pkgport.desktop "$root/usr/share/applications/pkgport.desktop"
            for size in 32 128 256; do
              install -Dm644 "assets/icon-$size.png" "$root/usr/share/icons/hicolor/${size}x${size}/apps/pkgport.png"
            done
            install -Dm644 assets/icon.svg "$root/usr/share/icons/hicolor/scalable/apps/pkgport.svg"
            install -d "$root/DEBIAN"
            printf 'Package: pkgport\nVersion: %s+%s\nArchitecture: amd64\nMaintainer: PKGPort contributors\nDescription: Local proxy for PlayStation package files\n' \
              "$VERSION" "${GITHUB_SHA:0:12}" > "$root/DEBIAN/control"
            dpkg-deb --build --root-owner-group "$root" "dist/$artifact"
          else
            app="$RUNNER_TEMP/PKGPort.app/Contents"
            mkdir -p "$app/MacOS" "$app/Resources"
            cp "$BINARY" "$app/MacOS/pkgport"
            cp assets/icon.icns "$app/Resources/PKGPort.icns"
            chmod +x "$app/MacOS/pkgport"
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict><key>CFBundleExecutable</key><string>pkgport</string><key>CFBundleIconFile</key><string>PKGPort.icns</string><key>CFBundleIdentifier</key><string>com.pkgport.desktop</string><key>CFBundleName</key><string>PKGPort</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>%s</string><key>CFBundleVersion</key><string>%s</string></dict></plist>' \
              "$VERSION" "$VERSION" > "$app/Info.plist"
            printf 'APPL????' > "$app/PkgInfo"
            # Ad-hoc signing seals the assembled bundle; it does not provide Developer ID trust.
            codesign --force --sign - "$RUNNER_TEMP/PKGPort.app"
            codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/PKGPort.app"
            hdiutil create -volname "PKGPort ($ARCH)" -srcfolder "$RUNNER_TEMP/PKGPort.app" \
              -ov -format UDZO "dist/$artifact"
          fi
      - name: Build Windows setup installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "/DAppVersion=$env:VERSION" "/O$env:GITHUB_WORKSPACE\dist" "installer\windows.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify package contents
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          file="dist/pkgport-$VERSION-$SUFFIX"
          test -s "$file"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            test "$(od -An -t x1 -N 2 "$file" | tr -d ' \n')" = "4d5a"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            dpkg-deb --info "$file" >/dev/null
            extracted="$RUNNER_TEMP/pkgport-deb"
            mkdir -p "$extracted"
            dpkg-deb --extract "$file" "$extracted"
            test -x "$extracted/usr/bin/pkgport"
            test -f "$extracted/usr/share/icons/hicolor/256x256/apps/pkgport.png"
          else
            hdiutil verify "$file"
            mount="$RUNNER_TEMP/pkgport-dmg"
            mkdir -p "$mount"
            trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
            hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$file"
            codesign --verify --deep --strict --verbose=2 "$mount/PKGPort.app"
            test -x "$mount/PKGPort.app/Contents/MacOS/pkgport"
            test -f "$mount/PKGPort.app/Contents/Resources/PKGPort.icns"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' \
              "$mount/PKGPort.app/Contents/Info.plist" | grep -qx 'PKGPort.icns'
          fi
      - name: Verify Windows setup and upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE "dist\pkgport-$env:VERSION-windows-x86_64-setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'pkgport-install-test'
          $settingsDir = Join-Path $env:APPDATA 'ps-rusty-downloader'
          $settingsFile = Join-Path $settingsDir 'settings.json'
          New-Item -ItemType Directory -Force -Path $settingsDir | Out-Null
          Set-Content -Path $settingsFile -Value '{"installTest":true}' -NoNewline
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir")
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Initial setup failed with exit code $($process.ExitCode)" }
          $installedExe = Join-Path $installDir 'pkgport.exe'
          if (!(Test-Path $installedExe)) { throw 'Installed executable is missing' }
          if (!(Test-Path (Join-Path $installDir 'unins000.exe'))) { throw 'Uninstaller is missing' }
          Set-Content -Path $installedExe -Value 'stale-version-marker' -NoNewline
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Upgrade setup failed with exit code $($process.ExitCode)" }
          if ((Get-FileHash $installedExe).Hash -ne (Get-FileHash (Join-Path $env:GITHUB_WORKSPACE 'target\release\pkgport.exe')).Hash) { throw 'Upgrade did not replace the stale executable' }
          if ((Get-Content -Raw $settingsFile) -ne '{"installTest":true}') { throw 'Upgrade changed the existing app settings' }
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Download build files
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: cd dist && sha256sum pkgport-* > SHA256SUMS.txt
      - name: Read download sizes
        id: download_sizes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          suffixes = {
              "windows": "windows-x86_64-setup.exe",
              "linux": "linux-x86_64.deb",
              "macos_arm": "macos-aarch64.dmg",
              "macos_intel": "macos-x86_64.dmg",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for platform, suffix in suffixes.items():
                  package = Path("dist") / f"pkgport-{os.environ['VERSION']}-{suffix}"
                  size = package.stat().st_size
                  if size == 0:
                      raise ValueError(f"Empty release package: {package}")
                  output.write(f"{platform}={size / 1024**2:.1f} MiB\n")
          PY
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.sha }}
          name: PKGPort ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Downloads / دریافت

            Choose the file for your system. / فایل مناسب سیستم‌عامل خود را انتخاب کنید.

            | Platform / سیستم‌عامل | Download | Size / حجم |
            | --- | --- | --- |
            | Windows x86_64 | [Setup `.exe`](https://github.com/${{ github.repository }}/releases/download/build-${{ github.sha }}/pkgport-${{ needs.build.outputs.version }}-windows-x86_64-setup.exe) | ${{ steps.download_sizes.outputs.windows }} |
            | Linux x86_64 | [`.deb`](https://github.com/${{ github.repository }}/releases/download/build-${{ github.sha }}/pkgport-${{ needs.build.outputs.version }}-linux-x86_64.deb) | ${{ steps.download_sizes.outputs.linux }} |
            | macOS Apple Silicon | [`.dmg`](https://github.com/${{ github.repository }}/releases/download/build-${{ github.sha }}/pkgport-${{ needs.build.outputs.version }}-macos-aarch64.dmg) | ${{ steps.download_sizes.outputs.macos_arm }} |
            | macOS Intel | [`.dmg`](https://github.com/${{ github.repository }}/releases/download/build-${{ github.sha }}/pkgport-${{ needs.build.outputs.version }}-macos-x86_64.dmg) | ${{ steps.download_sizes.outputs.macos_intel }} |

            [SHA256SUMS.txt](https://github.com/${{ github.repository }}/releases/download/build-${{ github.sha }}/SHA256SUMS.txt) contains checksums for the downloads.
          files: dist/*
